name: Build Fully Local Mirror

on:
  push:
    paths:
      - '.bootstrap/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Capture complete site locally
        run: python localize.py

      - name: Validate local mirror
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from bs4 import BeautifulSoup

          required = [
              'index.html',
              'work/index.html',
              'biography/index.html',
              'awards/index.html',
              'faq/index.html',
              'build/css/bundle-07fa906a73.css',
          ]
          missing = [p for p in required if not Path(p).is_file() or Path(p).stat().st_size == 0]
          if missing:
              raise SystemExit('Missing required output: ' + ', '.join(missing))

          bad_hosts = (
              'fast.fonts.net',
              'images.ctfassets.net',
              'videos.ctfassets.net',
              'vjs.zencdn.net',
              'bugsnag.com',
              'browser-update.org',
              'googletagmanager.com',
              'google-analytics.com',
              'cloudflareinsights.com',
          )

          asset_attrs = ('src', 'poster', 'data-src', 'data-video')
          failures = []
          for html_file in Path('.').rglob('*.html'):
              text = html_file.read_text('utf-8', errors='ignore')
              soup = BeautifulSoup(text, 'html.parser')
              for tag in soup.find_all(True):
                  for attr in asset_attrs:
                      value = tag.get(attr)
                      if isinstance(value, str) and value.startswith(('http://', 'https://', '//')):
                          failures.append(f'{html_file}: remote {attr} {value}')
                  for attr in ('srcset', 'data-srcset'):
                      value = tag.get(attr)
                      if isinstance(value, str):
                          for part in value.split(','):
                              url = part.strip().split()[0] if part.strip() else ''
                              if url.startswith(('http://', 'https://', '//')):
                                  failures.append(f'{html_file}: remote {attr} {url}')
              lower = text.lower()
              for host in bad_hosts:
                  if host in lower:
                      failures.append(f'{html_file}: remote host reference {host}')

          for ext in ('*.css', '*.js', '*.mjs'):
              for f in Path('.').rglob(ext):
                  text = f.read_text('utf-8', errors='ignore').lower()
                  for host in bad_hosts:
                      if host in text:
                          failures.append(f'{f}: remote host reference {host}')

          oversized = [str(p) for p in Path('.').rglob('*') if p.is_file() and p.stat().st_size >= 100 * 1024 * 1024]
          if oversized:
              failures.append('Files exceed GitHub 100 MB limit: ' + ', '.join(oversized))

          if failures:
              print('\n'.join(failures[:200]))
              raise SystemExit(f'Local mirror validation failed with {len(failures)} issue(s)')

          print('Local mirror validation passed')
          PY

      - name: Commit generated mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Build fully local Alan Menken mirror"
          git push origin main
