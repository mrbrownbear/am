name: Build Local Mirror

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: local-mirror-main
  cancel-in-progress: false

jobs:
  localize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Build fully local static mirror
        run: python localize.py

      - name: Validate generated build
        run: |
          test -s index.html
          test -s build/js/main-ed48f9e533.js
          test -s build/css/bundle-07fa906a73.css
          if grep -RInE 'https?://(www\.)?alanmenken\.com/(build|assets|cdn-cgi)' . --exclude-dir=.git --exclude=localize.py --exclude='*.md'; then
            echo "Found a runtime dependency on the live source site."
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          bad = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              if p.stat().st_size >= 100 * 1024 * 1024:
                  bad.append((p, p.stat().st_size))
          if bad:
              for p, size in bad:
                  print(f"{p}: {size} bytes")
              raise SystemExit("GitHub rejects individual files at or above 100 MiB")
          PY

      - name: Commit localized site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Build fully local Alan Menken mirror"
          git push origin main
